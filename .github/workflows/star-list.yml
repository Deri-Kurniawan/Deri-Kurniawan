name: Update Starred Repository Knowledge Base

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate starred repository files
        id: starred
        uses: Deri-Kurniawan/github-starred-repository-action@v1
        with:
          username: Deri-Kurniawan
          output-file: REPOSITORY_STAR_LIST.md
          digest-file: REPOSITORY_STAR_DIGEST.md
          token: ${{ secrets.STARRED_REPOSITORIES_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add REPOSITORY_STAR_LIST.md
          git add REPOSITORY_STAR_DIGEST.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update starred repository knowledge base"
          git push
