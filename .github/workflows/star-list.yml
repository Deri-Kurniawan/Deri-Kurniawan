name: Update Starred Repositories

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate starred repositories
        id: starred
        uses: Deri-Kurniawan/github-starred-repository-action@v1.1.0
        with:
          username: Deri-Kurniawan

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            REPOSITORY_STAR_LIST.md \
            REPOSITORY_STAR_DIGEST.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update starred repositories"
          git push
